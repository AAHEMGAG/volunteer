<!DOCTYPE html>
<html>
<head>
    <title>Contact Form</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            emailjs.init({
              publicKey: "uoMg5EOFQacSZtywQ",
            });
        })();
    </script>
    <script type="text/javascript">
        window.onload = function() {
            document.getElementById('contact-form').addEventListener('submit', function(event) {
                event.preventDefault();

                // 1. Read the current values typed by the user
                const params = {
                    recipient: document.getElementById('user_name').value,
                    email: document.getElementById('user_email').value,
                    experiment: document.getElementById('user_title').value,
                    time: new Date().toLocaleTimeString() // Generates the current time automatically
                };

                // 2. Send the parameters object to EmailJS
                emailjs.send("service_jmt8ejl", "template_z37jnqk", params)
                    .then(() => {
                        console.log('SUCCESS!');
                        alert('Message sent successfully!');
                        document.getElementById('contact-form').reset(); // Clears form after sending
                    }, (error) => {
                        console.log('FAILED...', error);
                        alert('Failed to send message. Check the console for errors.');
                    });
            });
        }
    </script>
</head>
<body>
    <h1>Volunteer Application</h1>
    <a href="about.html">About the Experiments</a>
    
    <form id="contact-form">
        <label><b>Name*</b></label>
        <input type="text" id="user_name" required>

        <label><b>Email</b></label>
        <input type="email" id="user_email" required>

        <label><b>Experiment</b></label>
        <select id="user_title" required>
            <option value="Learning DnD Alignment Chart">Learning Experiment</option>
        </select>
        <input type="submit" value="Send">
    </form>
</body>
</html>
